{% extends 'base.html' %}

{% block content %}

<section class="container news-page">

    <h1>News</h1>

    <div class="mt-3">

        {% for item in news %}

        <article class="news-item">

            <div class="small text-muted">
                {{ item.date }}
            </div>

            <h5 class="mb-1">
                {% if item.link %}
                    <a
                        href="{{ item.link }}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        {{ item.title }}
                    </a>
                {% else %}
                    {{ item.title }}
                {% endif %}
            </h5>

            <p>
                {{ item.summary }}
            </p>

        </article>

        {% else %}

        <div class="text-muted">
            No news yet.
        </div>

        {% endfor %}

    </div>

</section>

{% endblock %}
